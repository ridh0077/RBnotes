<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RIDHAM | Multi-Theme Pro Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

    <!-- PDF Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        /* Smooth Transition Logic */
        :root {
            --bg-color: #000000;
            --header-bg: #000000;
            --card-bg: #1a1a1a;
            --accent: #E4FF1A;
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
            --border-color: #2a2a2a;
            --danger: #ff4757;
            --wa-green: #25D366;
            --info: #3498db;
        }

        /* Light Mode Overrides */
        body.light-mode {
            --bg-color: #f4f4f9;
            --header-bg: #ffffff;
            --card-bg: #ffffff;
            --text-main: #1a1a1a;
            --text-sub: #555555;
            --border-color: #dddddd;
        }

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box; 
            font-family: 'Poppins', sans-serif;
            transition: background 0.4s ease, color 0.4s ease, border-color 0.4s ease;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 120px;
            overflow-x: hidden;
        }

        /* Auth Screen */
        #authOverlay {
            position: fixed;
            inset: 0;
            background: #000;
            z-index: 9999;
            display: none; 
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .auth-card {
            background: #111;
            border: 2px solid var(--accent);
            border-radius: 25px;
            padding: 30px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 0 30px rgba(228, 255, 26, 0.2);
        }
        .auth-card h2 {
            font-family: 'Orbitron';
            color: var(--accent);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }
        .auth-card input {
            width: 100%;
            padding: 14px;
            margin-bottom: 15px;
            background: #222;
            border: 1px solid #333;
            border-radius: 12px;
            color: #fff;
        }
        .auth-btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            text-transform: uppercase;
        }
        .auth-toggle {
            margin-top: 15px;
            font-size: 12px;
            color: var(--text-sub);
            cursor: pointer;
        }

        /* Header */
        header {
            background: var(--header-bg);
            padding: 12px 20px;
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            position: sticky; 
            top: 0; 
            z-index: 1000;
            border-bottom: 2px solid var(--accent);
        }

        .logo-container { 
            width: 48px; 
            height: 48px; 
            border-radius: 50%; 
            overflow: hidden; 
            border: 2px solid var(--accent);
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .logo-container img { width: 100%; height: 100%; object-fit: cover; }
        
        .main-title { 
            font-family: 'Orbitron', sans-serif;
            font-size: 1.5rem; 
            font-weight: 800; 
            color: var(--accent); 
            letter-spacing: 3px; 
        }

        /* Menu Styling */
        .menu-container { position: relative; cursor: pointer; padding: 5px; }
        .dots { font-size: 28px; color: var(--accent); line-height: 1; }
        
        .dropdown-menu {
            display: none; 
            position: absolute; 
            right: 0; 
            top: 45px;
            background: var(--card-bg); 
            border-radius: 12px; 
            width: 260px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            overflow: hidden; 
            border: 1px solid var(--accent);
        }

        .menu-profile {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px;
            background: rgba(128,128,128,0.1);
            border-bottom: 1px solid var(--accent);
            gap: 10px;
        }
        .profile-info {
            display: flex;
            flex-direction: column;
            text-align: left;
            overflow: hidden;
            flex: 1;
        }
        .profile-name {
            font-family: 'Orbitron';
            font-weight: 800;
            color: var(--accent);
            font-size: 14px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .profile-email {
            font-size: 10px;
            color: var(--text-sub);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }
        .menu-profile img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid var(--accent);
            object-fit: cover;
            flex-shrink: 0;
        }

        .dropdown-menu button { 
            width: 100%; 
            padding: 14px; 
            border: none; 
            background: none; 
            text-align: left; 
            cursor: pointer; 
            font-size: 14px; 
            color: var(--text-main); 
            border-bottom: 1px solid var(--border-color); 
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .dropdown-menu button:hover { background: var(--accent); color: #000; font-weight: bold; }
        .dropdown-menu button svg { width: 18px; height: 18px; fill: currentColor; }

        .theme-folder { background: rgba(128,128,128,0.05); }
        .theme-list { display: none; padding: 5px; background: var(--bg-color); border-top: 1px solid var(--accent); }
        .theme-option { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            padding: 10px !important; 
            font-size: 12px !important;
            color: var(--text-main) !important;
        }
        .color-dot { width: 15px; height: 15px; border-radius: 50%; border: 1px solid #fff; }

        /* Search Section */
        .search-section { 
            padding: 15px 20px 5px 20px; 
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .search-box-wrapper {
            position: relative;
            flex: 1;
        }
        .search-box {
            background: var(--card-bg);
            border: 1.5px solid var(--accent);
            border-radius: 12px;
            padding: 14px 20px;
            color: var(--text-main);
            width: 100%;
            outline: none;
            font-size: 14px;
        }
        .view-sort-btn, .shop-list-btn {
            background: var(--card-bg);
            border: 1.5px solid var(--accent);
            border-radius: 50%; 
            width: 50px;
            height: 50px;
            padding: 0; 
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden; 
            flex-shrink: 0;
        }
        .shop-list-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .view-sort-btn {
            border-radius: 12px; 
            width: 48px;
            height: 48px;
        }
        .view-sort-btn svg {
            width: 24px;
            height: 24px;
            fill: var(--accent);
        }

        /* Rotation Animation */
        @keyframes rotateShopIcon {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .rotating {
            animation: rotateShopIcon 0.6s ease-in-out;
        }

        /* VIEW SORT MODAL */
        .vs-modal {
            display: none;
            position: fixed;
            top: 135px;
            right: 20px;
            width: 280px; 
            background: var(--card-bg);
            border: 2px solid var(--accent);
            border-radius: 20px;
            padding: 15px; 
            z-index: 1500;
            box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        }
        .vs-close-icon {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 24px;
            height: 24px;
            cursor: pointer;
            fill: var(--accent);
            z-index: 10;
        }
        .vs-section-title {
            background: #333;
            color: #fff;
            padding: 3px 10px;
            border-radius: 6px;
            font-size: 10px; 
            font-weight: 800;
            display: inline-block;
            margin-bottom: 12px;
        }
        .vs-row {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .vs-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            min-width: 58px; 
            cursor: pointer;
        }
        .vs-icon-box {
            background: rgba(128,128,128,0.2);
            width: 38px; 
            height: 38px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid var(--border-color);
        }
        .vs-item.active .vs-icon-box {
            border-color: var(--accent);
            box-shadow: 0 0 8px var(--accent);
        }
        .vs-item.active .vs-icon-box svg {
            fill: var(--accent);
        }
        .vs-icon-box svg {
            width: 18px; 
            height: 18px;
            fill: #888;
        }
        .vs-label {
            font-size: 9px; 
            color: var(--text-main);
            background: rgba(128,128,128,0.2);
            padding: 2px 6px;
            border-radius: 5px;
        }
        .vs-item.active .vs-label {
            background: var(--text-main);
            color: var(--bg-color);
            font-weight: 800;
        }

        /* Banner */
        .banner-container { 
            padding: 10px 20px; 
        }
        .image-banner {
            width: 100%;
            height: auto;
            border-radius: 15px;
            border: 1.5px solid var(--accent);
            display: block;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            object-fit: cover;
        }

        /* Monthly Headers */
        .month-header {
            background: var(--card-bg);
            padding: 12px 15px; 
            margin: 25px 0 5px 0;
            border-radius: 0 12px 12px 0; 
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            border-left: 6px solid var(--accent);
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
        }
        .month-title { font-weight: 800; color: var(--accent); text-transform: uppercase; font-size: 14px; letter-spacing: 1px; }

        /* Shop Group Header */
        .shop-group-header {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-main);
            background: rgba(128, 128, 128, 0.1);
            padding: 5px 15px;
            margin: 10px 0 8px 10px;
            border-radius: 8px 0 0 8px;
            display: inline-block;
            border-left: 3px solid var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .toggle-icon {
            font-size: 18px;
            font-weight: 800;
            color: #000;
            background: var(--accent);
            width: 24px;
            height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            margin-left: 10px;
        }

        /* Cards */
        .container { padding: 10px 15px; max-width: 600px; margin: auto; }
        .note-card {
            background: var(--card-bg);
            border-radius: 18px; 
            padding: 20px;
            margin-bottom: 18px; 
            border: 1px solid var(--border-color);
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .note-card::after {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 3px; background: var(--accent); border-radius: 18px 18px 0 0;
        }
        
        .model-name { font-size: 1.3rem; font-weight: 800; color: var(--accent); }
        .cust-info { font-size: 13px; color: var(--text-sub); margin-top: 5px; }
        .timestamp-badge { color: var(--accent); font-size: 11px; font-weight: 600; }

        .parts-container { margin: 15px 0; background: rgba(128,128,128,0.1); border-radius: 12px; padding: 14px; border: 1px solid var(--border-color); }
        .part-item { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border-color); font-size: 13px; }
        .part-shop { font-size: 10px; color: var(--text-sub); display: block; font-style: italic; }
        
        .profit-line { 
            margin-top: 15px; padding-top: 15px; border-top: 1px solid var(--border-color); 
            display: flex; justify-content: space-between; font-weight: 800; font-size: 1.15rem; 
        }
        .profit-amt { color: var(--accent); }

        .actions { margin-top: 20px; display: flex; justify-content: space-between; align-items: center; }
        .btn-group { display: flex; gap: 18px; }
        .actions button { background: none; border: none; font-size: 11px; font-weight: 800; cursor: pointer; color: var(--text-sub); text-transform: uppercase; }
        
        .share-wa { 
            background: var(--accent) !important; 
            color: #000 !important; 
            padding: 9px 18px; 
            border-radius: 10px !important; 
            font-weight: 800 !important;
        }

        /* VIEW MODES */
        .view-compact .note-card { padding: 8px 12px; margin-bottom: 8px; border-radius: 10px; }
        .view-compact .model-name { font-size: 14px; }
        .view-compact .cust-info { font-size: 10px; margin-top: 2px; }
        .view-compact .timestamp-badge { font-size: 9px; }
        .view-compact .parts-container { margin: 4px 0; padding: 5px 8px; border-radius: 6px; }
        .view-compact .part-item { padding: 2px 0; font-size: 11px; border: none; flex-direction: column; align-items: flex-start; }
        .view-compact .part-shop { display: inline; margin-left: 5px; }
        .view-compact .profit-line { margin-top: 4px; padding-top: 4px; font-size: 12px; border-top: 1px dashed var(--border-color); }
        .view-compact .actions { display: none; }

        .view-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .view-grid .note-card { margin-bottom: 0; padding: 10px; border-radius: 12px; }
        .view-grid .parts-container { margin: 6px 0; padding: 5px; font-size: 10px; border-radius: 6px; }
        .view-grid .part-item { padding: 2px 0; border: none; flex-direction: column; align-items: flex-start; }
        .view-grid .part-shop { font-size: 8px; }
        .view-grid .actions, .view-grid .cust-info { display: none; }
        .view-grid .model-name { font-size: 12px; }
        .view-grid .profit-line { font-size: 11px; border: none; margin-top: 4px; padding-top: 4px; border-top: 1px dashed var(--border-color); }

        .view-hidden { display: none; }

        /* FAB */
        .fab { 
            position: fixed; 
            right: 25px; 
            bottom: 95px; 
            width: 62px; 
            height: 62px; 
            background: var(--accent); 
            color: #000; 
            border-radius: 18px; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 38px; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.3); 
            cursor: pointer; 
            border: 3px solid #000; 
            z-index: 999; 
        }

        /* Footer */
        .footer { 
            position: fixed; 
            bottom: 0; 
            width: 100%; 
            background: var(--accent); 
            padding: 18px; 
            text-align: center; 
            border-top: 4px solid #fff; 
            z-index: 1000; 
        }
        .total-amount { font-family: 'Orbitron', sans-serif; font-size: 1.25rem; font-weight: 800; color: #000; }

        /* Modals */
        .modal { 
            display: none; 
            position: fixed; 
            inset: 0; 
            background: rgba(0, 0, 0, 0.6); 
            backdrop-filter: blur(8px); 
            z-index: 2000; 
            padding: 20px; 
            align-items: center; 
            justify-content: center; 
        }
        .modal-content { 
            background: var(--card-bg); 
            padding: 30px; 
            border-radius: 25px; 
            width: 100%;
            max-width: 480px; 
            border: 2px solid var(--accent); 
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }
        .modal-close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            color: var(--text-sub);
            cursor: pointer;
            font-weight: bold;
        }
        label { font-size: 11px; color: var(--accent); text-transform: uppercase; font-weight: 800; display: block; margin-top: 10px; }
        input, select { 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 5px; 
            background: rgba(128,128,128,0.1); 
            border: 1px solid var(--border-color); 
            border-radius: 12px; 
            color: var(--text-main); 
            outline: none; 
        }
        .save-btn { background: var(--accent); color: #000; border: none; width: 100%; padding: 18px; border-radius: 14px; font-weight: 800; cursor: pointer; font-size: 17px; margin-top: 20px; }

        /* SCREENSHOT STYLE MODAL FOR DELETE & PDF */
        .small-modal-content {
            background: #000;
            border: 2px solid var(--accent);
            border-radius: 35px;
            padding: 40px 30px;
            width: 100%;
            max-width: 340px;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 50px rgba(0,0,0,1);
        }

        .modal-icon-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 25px;
            border: 2.5px solid;
        }
        .modal-icon-circle svg {
            width: 30px;
            height: 30px;
        }

        .modal-title {
            font-family: 'Orbitron';
            color: #fff;
            font-size: 18px;
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 12px;
            text-transform: uppercase;
        }

        .modal-desc {
            color: #888;
            font-size: 13px;
            margin-bottom: 30px;
            line-height: 1.4;
        }

        .modal-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn-cancel {
            background: #1a1a1a;
            color: #fff;
            border: none;
            padding: 14px 0;
            width: 130px;
            border-radius: 15px;
            font-weight: 800;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-confirm {
            background: var(--accent);
            color: #000;
            border: none;
            padding: 14px 0;
            width: 130px;
            border-radius: 15px;
            font-weight: 800;
            cursor: pointer;
            font-size: 14px;
        }

        /* Specific Select styling for PDF Modal */
        #pdfMonthSelect {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 12px;
            border-radius: 12px;
            margin-bottom: 25px;
            font-size: 14px;
            text-align: center;
        }

        /* BOTTOM SHEET STYLE FOR SHOP SELECTION */
        .bottom-sheet {
            position: fixed;
            bottom: -100%;
            left: 0;
            width: 100%;
            background: #222;
            border-radius: 30px 30px 0 0;
            z-index: 3000;
            transition: bottom 0.4s ease;
            max-height: 70vh;
            overflow-y: auto;
            padding: 20px;
            border-top: 3px solid var(--accent);
            box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
        }
        .bottom-sheet.active { bottom: 0; }
        .sheet-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            border-bottom: 1px solid #333;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
        }
        .sheet-item:last-child { border: none; }
        .radio-circle {
            width: 22px;
            height: 22px;
            border: 2px solid #555;
            border-radius: 50%;
            position: relative;
        }
        .sheet-item.selected .radio-circle {
            border-color: var(--accent);
        }
        .sheet-item.selected .radio-circle::after {
            content: '';
            position: absolute;
            inset: 4px;
            background: var(--accent);
            border-radius: 50%;
        }
        .sheet-handle {
            width: 40px;
            height: 4px;
            background: #555;
            border-radius: 2px;
            margin: 0 auto 15px;
        }

        /* SHOP MANAGER ACCORDION */
        .inv-group-shop-name-row { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin: 25px 0 10px;
            cursor: pointer;
        }
        .inv-group-shop-name { font-family: 'Orbitron'; font-size: 18px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
        .inv-group-toggle-btn {
            background: var(--accent);
            color: #000;
            width: 24px;
            height: 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            font-weight: 800;
            font-size: 18px;
        }

        .inv-date-badge { background: #333; color: #fff; padding: 4px 12px; border-radius: 6px; font-size: 10px; font-weight: 800; display: inline-block; margin: 15px 0 8px 0; }
        .inv-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 13px; }
        .inv-model-part { color: #fff; font-size: 14px; }
        .inv-model-part strong { color: #fff; font-weight: 600; }
        .inv-price { color: #fff; font-weight: 600; }
        .inv-divider { border-bottom: 1px dashed #444; margin: 25px 0; }

        /* Fake select display */
        .custom-select-trigger {
            background: rgba(128,128,128,0.1);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        /* SHOP MANAGER HEADER SECTION */
        .shop-manager-title { font-family: 'Orbitron'; font-size: 20px; color: #fff; margin-bottom: 25px; letter-spacing: 2px; }
        
        .perm-shop-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
        }
        .perm-input-row { display: flex; gap: 10px; align-items: center; margin-bottom: 15px; }
        .perm-input-row input { margin-bottom: 0; background: #222; border: none; }

    <script>
        // --- FIREBASE CONFIG ---
        const firebaseConfig = {
            apiKey: "AIzaSyCVF8HoXlz_KP5HzvyXm6c-pcmgYbwlRIQ",
            authDomain: "rbnotes-192b5.firebaseapp.com",
            projectId: "rbnotes-192b5",
            storageBucket: "rbnotes-192b5.firebasestorage.app",
            messagingSenderId: "952806658735",
            appId: "1:952806658735:web:3984cc8678d9f3c16eba5a"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let repairs = [];
        let permanentShops = [];
        let currentView = localStorage.getItem('ridham_view') || 'detailed';
        let currentSort = localStorage.getItem('ridham_sort') || 'date';
        let sortOrder = localStorage.getItem('ridham_order') || 'desc';
        let isLightMode = localStorage.getItem('ridham_light') === 'true';
        let itemToDeleteIndex = -1;
        let isSignupMode = false;
        let currentUser = null;
        let collapsedMonths = {};
        let collapsedShopInventory = {};

        // --- AUTH LOGIC ---
        function toggleAuthMode() {
            isSignupMode = !isSignupMode;
            document.getElementById('authTitle').innerText = isSignupMode ? "CREATE ACCOUNT" : "RIDHAM LOGIN";
            document.getElementById('authSubmitBtn').innerText = isSignupMode ? "SIGN UP" : "LOGIN";
            document.getElementById('authToggle').innerText = isSignupMode ? "Already have an account? Login" : "Don't have an account? Sign Up";
        }

        async function handleAuth() {
            const email = document.getElementById('authEmail').value;
            const password = document.getElementById('authPassword').value;
            const errorDiv = document.getElementById('authError');
            errorDiv.innerText = "";
            if(!email || !password) return alert("Fill all fields");
            try {
                if(isSignupMode) await auth.createUserWithEmailAndPassword(email, password);
                else await auth.signInWithEmailAndPassword(email, password);
            } catch (error) { errorDiv.innerText = error.message; }
        }

        auth.onAuthStateChanged(user => {
            const authOverlay = document.getElementById('authOverlay');
            if (user) {
                currentUser = user;
                authOverlay.style.display = 'none';
                document.getElementById('userDisplayEmail').innerText = user.email.toUpperCase();
                syncFromCloud();
            } else {
                currentUser = null;
                authOverlay.style.display = 'flex';
                repairs = [];
                render();
            }
        });

        function logout() { auth.signOut(); }

        async function syncFromCloud() {
            if(!currentUser) return;
            db.collection("repairs_data").doc(currentUser.uid).onSnapshot((doc) => {
                if (doc.exists) { 
                    repairs = doc.data().repairs || []; 
                    permanentShops = doc.data().permanentShops || [];
                    render(); 
                    renderShopManager();
                }
                else { repairs = []; permanentShops = []; render(); }
            });
        }

        async function syncToCloud() {
            if(!currentUser) return;
            await db.collection("repairs_data").doc(currentUser.uid).set({ 
                repairs: repairs, 
                permanentShops: permanentShops 
            });
        }

        // --- THEMES ---
        const themes = {
            rbmods: { bg: "#000", header: "#000", card: "#1a1a1a", accent: "#E4FF1A", text: "#fff", border: "#2a2a2a" },
            electric: { bg: "#1E1E1E", header: "#1E1E1E", card: "#2d2d2d", accent: "#B23EFF", text: "#fff", border: "#3d3d3d" },
            cyberpunk: { bg: "#000", header: "#000", card: "#111", accent: "#fc09ff", text: "#fff", border: "#04e0e3" },
            sunset: { bg: "#500B28", header: "#500B28", card: "#6b0f35", accent: "#E21C34", text: "#fff", border: "#801240" },
            ocean: { bg: "#020a1a", header: "#020a1a", card: "#0a162e", accent: "#00F4FD", text: "#fff", border: "#0600ff" },
            warm: { bg: "#2b1b0a", header: "#2b1b0a", card: "#3d2a14", accent: "#FBAB7E", text: "#fff", border: "#F7CE68" },
            mint: { bg: "#051a14", header: "#051a14", card: "#0c2b21", accent: "#07D0A4", text: "#fff", border: "#C2FCD4" },
            slate: { bg: "#273748", header: "#1e2a38", card: "#33475c", accent: "#acb3b8", text: "#fff", border: "#445d78" }
        };

        function toggleMenu(e) { 
            e.stopPropagation(); 
            const d = document.getElementById('dropdown'); 
            d.style.display = (d.style.display === 'block') ? 'none' : 'block'; 
        }

        function toggleVSModal(e) {
            e.stopPropagation();
            const m = document.getElementById('vsModal');
            m.style.display = (m.style.display === 'block') ? 'none' : 'block';
            updateVSUI();
        }

        function toggleThemeList(e) {
            e.stopPropagation();
            const list = document.getElementById('themeList');
            list.style.display = (list.style.display === 'block') ? 'none' : 'block';
        }

        function applyTheme(name) {
            const t = themes[name];
            const root = document.documentElement;
            if(!isLightMode) {
                root.style.setProperty('--bg-color', t.bg);
                root.style.setProperty('--header-bg', t.header);
                root.style.setProperty('--card-bg', t.card);
                root.style.setProperty('--text-main', t.text);
                root.style.setProperty('--border-color', t.border);
            }
            root.style.setProperty('--accent', t.accent);
            localStorage.setItem('ridham_theme', name);
        }

        function toggleLightMode() {
            isLightMode = !isLightMode;
            localStorage.setItem('ridham_light', isLightMode);
            document.body.classList.toggle('light-mode', isLightMode);
            const btnText = document.getElementById('lightToggleText');
            if(isLightMode) btnText.innerText = "Dark Mode";
            else btnText.innerText = "Light Mode";
            applyTheme(localStorage.getItem('ridham_theme') || 'rbmods');
        }

        function changeView(view) {
            currentView = view;
            localStorage.setItem('ridham_view', view);
            updateVSUI();
            render();
        }

        function changeSort(sort) {
            currentSort = sort;
            localStorage.setItem('ridham_sort', sort);
            updateVSUI();
            render();
        }

        function toggleOrder() {
            sortOrder = (sortOrder === 'asc') ? 'desc' : 'asc';
            localStorage.setItem('ridham_order', sortOrder);
            updateVSUI();
            render();
        }

        function updateVSUI() {
            document.querySelectorAll('.vs-item[id^="v-"]').forEach(el => el.classList.remove('active'));
            const viewEl = document.getElementById('v-' + currentView);
            if(viewEl) viewEl.classList.add('active');
            document.querySelectorAll('.vs-item[id^="s-"]').forEach(el => el.classList.remove('active'));
            const sortEl = document.getElementById('s-' + currentSort);
            if(sortEl) sortEl.classList.add('active');
            document.getElementById('orderLabel').innerText = sortOrder.toUpperCase();
        }

        function openModal(index = -1) {
            const m = document.getElementById('noteModal');
            m.style.display = 'flex';
            document.getElementById('partInputsContainer').innerHTML = "";
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('serviceDate').value = today;
            
            if(index > -1) {
                const r = repairs[index];
                document.getElementById('editIndex').value = index;
                document.getElementById('custName').value = r.custName || "";
                document.getElementById('custPhone').value = r.custPhone || "";
                document.getElementById('model').value = r.model;
                document.getElementById('shop').value = r.shop || "Direct Entry";
                document.getElementById('selectedShopDisplay').innerText = r.shop || "Direct Entry";
                document.getElementById('paid').value = r.paid;
                const dateParts = r.date.split('/');
                if(dateParts.length === 3) {
                    const isoDate = `${dateParts[2]}-${dateParts[1]}-${dateParts[0]}`;
                    document.getElementById('serviceDate').value = isoDate;
                }
                if(r.parts && r.parts.length > 0) {
                    r.parts.forEach(p => addPartInputRow(p.name, p.shop, p.price));
                } else {
                    addPartInputRow();
                }
            } else {
                document.getElementById('editIndex').value = "-1";
                document.getElementById('custName').value = ""; 
                document.getElementById('custPhone').value = "";
                document.getElementById('model').value = ""; 
                document.getElementById('shop').value = "Direct Entry"; 
                document.getElementById('selectedShopDisplay').innerText = "Direct Entry";
                document.getElementById('paid').value = "";
                addPartInputRow();
            }
        }

        function closeModal() { document.getElementById('noteModal').style.display = 'none'; }

        // --- SHOP ICON CLICK HANDLER WITH ROTATION ---
        function handleShopIconClick(el) {
            el.classList.add('rotating');
            setTimeout(() => {
                el.classList.remove('rotating');
                openShopListModal();
            }, 600);
        }

        // --- SHOP PICKER FUNCTIONS ---
        let currentActivePartShopIndex = -1;

        function openShopPicker(index = -1) {
            currentActivePartShopIndex = index;
            const sheet = document.getElementById('shopPickerSheet');
            const list = document.getElementById('shopPickerList');
            const currentVal = (index === -1) ? document.getElementById('shop').value : document.querySelectorAll('.p-shop')[index].value;

            let html = `
                <div class="sheet-item ${currentVal === 'Direct Entry' ? 'selected' : ''}" onclick="selectShop('Direct Entry')">
                    <span>Direct Entry</span>
                    <div class="radio-circle"></div>
                </div>`;
            
            permanentShops.forEach(s => {
                html += `
                    <div class="sheet-item ${currentVal === s ? 'selected' : ''}" onclick="selectShop('${s}')">
                        <span>${s}</span>
                        <div class="radio-circle"></div>
                    </div>`;
            });

            list.innerHTML = html;
            sheet.classList.add('active');
        }

        function closeShopPicker() {
            document.getElementById('shopPickerSheet').classList.remove('active');
        }

        function selectShop(name) {
            if(currentActivePartShopIndex === -1) {
                document.getElementById('shop').value = name;
                document.getElementById('selectedShopDisplay').innerText = name;
            } else {
                const selects = document.querySelectorAll('.p-shop');
                const displays = document.querySelectorAll('.p-shop-display');
                if(selects[currentActivePartShopIndex]) {
                    selects[currentActivePartShopIndex].value = name;
                    displays[currentActivePartShopIndex].innerText = name;
                }
            }
            closeShopPicker();
        }

        // --- SHOP MANAGER FUNCTIONS ---

        function openShopListModal() {
            document.getElementById('shopListModal').style.display = 'flex';
            renderShopManager();
        }

        function closeShopListModal() {
            document.getElementById('shopListModal').style.display = 'none';
        }

        async function addPermanentShop() {
            const val = document.getElementById('permShopInput').value.trim();
            if(!val) return;
            if(permanentShops.includes(val)) return alert("Already exists");
            permanentShops.push(val);
            document.getElementById('permShopInput').value = "";
            await syncToCloud();
        }

        async function removePermanentShop(name) {
            permanentShops = permanentShops.filter(s => s !== name);
            await syncToCloud();
        }

        function toggleShopInventory(shopName) {
            collapsedShopInventory[shopName] = !collapsedShopInventory[shopName];
            renderShopManager();
        }

        function renderShopManager() {
            const tagContainer = document.getElementById('permShopTags');
            tagContainer.innerHTML = permanentShops.map(s => `
                <div class="shop-tag">
                    ${s} <span class="shop-tag-del" onclick="removePermanentShop('${s}')">×</span>
                </div>
            `).join('');

            const invContainer = document.getElementById('shopManagerInventory');
            invContainer.innerHTML = "";

            const allItems = [];
            repairs.forEach(rep => {
                if(rep.archived) return;
                rep.parts.forEach(p => {
                    allItems.push({
                        shop: p.shop || "Direct Entry",
                        model: rep.model,
                        partName: p.name,
                        price: p.price,
                        date: rep.date,
                        timestamp: rep.timestamp
                    });
                });
            });

            const shopGroups = {};
            permanentShops.forEach(s => shopGroups[s] = {});

            allItems.forEach(item => {
                if (shopGroups[item.shop]) {
                    if(!shopGroups[item.shop][item.date]) shopGroups[item.shop][item.date] = [];
                    shopGroups[item.shop][item.date].push(item);
                }
            });

            permanentShops.forEach(shop => {
                const datesObj = shopGroups[shop];
                const dates = Object.keys(datesObj).sort((a,b) => {
                    return new Date(b.split('/').reverse().join('-')) - new Date(a.split('/').reverse().join('-'));
                });

                if(dates.length > 0) {
                    const isCollapsed = collapsedShopInventory[shop];
                    const toggleIcon = isCollapsed ? '+' : '−';

                    let shopHtml = `
                        <div class="inv-group-shop-name-row" onclick="toggleShopInventory('${shop}')">
                            <div class="inv-group-shop-name">${shop}</div>
                            <div class="inv-group-toggle-btn">${toggleIcon}</div>
                        </div>`;
                    
                    if (!isCollapsed) {
                        dates.forEach(date => {
                            shopHtml += `<div class="inv-date-badge">${date}</div>`;
                            datesObj[date].forEach(item => {
                                shopHtml += `
                                    <div class="inv-row">
                                        <div class="inv-model-part"><strong>${item.model}:</strong> ${item.partName}</div>
                                        <div class="inv-price">₹${item.price}</div>
                                    </div>`;
                            });
                        });
                        shopHtml += `<div class="inv-divider"></div>`;
                    }
                    invContainer.innerHTML += shopHtml;
                }
            });
        }

        // --- REPAIR RECORD FUNCTIONS ---

        function deleteItem(index) {
            itemToDeleteIndex = index;
            document.getElementById('deleteModal').style.display = 'flex';
        }

        function closeDeleteModal() {
            document.getElementById('deleteModal').style.display = 'none';
            itemToDeleteIndex = -1;
        }

        document.getElementById('confirmDelBtn').onclick = async function() {
            if (itemToDeleteIndex > -1) {
                repairs[itemToDeleteIndex].archived = true;
                await syncToCloud();
                render();
                closeDeleteModal();
            }
        };

        function openPDFModal() {
            const activeRepairs = repairs.filter(r => !r.archived);
            const monthList = [...new Set(activeRepairs.map(r => r.monthKey))];
            if(monthList.length === 0) return alert("No active data!");
            const select = document.getElementById('pdfMonthSelect');
            select.innerHTML = monthList.map(m => `<option value="${m}">${m}</option>`).join('');
            document.getElementById('pdfModal').style.display = 'flex';
        }

        function closePDFModal() { document.getElementById('pdfModal').style.display = 'none'; }

        function triggerPDFDownload() {
            const selectedMonth = document.getElementById('pdfMonthSelect').value;
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const monthData = repairs.filter(r => r.monthKey === selectedMonth && !r.archived);
            doc.setFillColor(0, 0, 0); doc.rect(0, 0, 210, 30, 'F');
            doc.setFontSize(22); doc.setTextColor(228, 255, 26); doc.text("RIDHAM REPAIR REPORT", 105, 20, null, null, "center");
            doc.setTextColor(0, 0, 0); doc.setFontSize(12); doc.text("Month: " + selectedMonth, 15, 40);
            const rows = []; let totalProfit = 0;
            monthData.forEach(r => {
                const profit = (r.paid || 0) - (r.totalCost || 0);
                totalProfit += profit;
                const workDetails = r.parts.map(p => `${p.name} (${p.shop || 'Local'}) - ${p.price}`).join(", ");
                rows.push([r.date, r.model, r.custName || 'Walk-in', workDetails, `INR ${r.paid}`, `INR ${profit}`]);
            });
            doc.autoTable({
                startY: 55, head: [['Date', 'Model', 'Customer', 'Details', 'Paid', 'Profit']],
                body: rows, theme: 'striped', headStyles: { fillColor: [0, 0, 0], textColor: [228, 255, 26] },
                styles: { fontSize: 9 }, margin: { left: 10, right: 10 }
            });
            const finalY = doc.lastAutoTable.finalY || 60;
            doc.setFontSize(14); doc.setTextColor(0, 0, 0); doc.line(140, finalY + 5, 200, finalY + 5);
            doc.text(`TOTAL MONTHLY SAVINGS: INR ${totalProfit}`, 200, finalY + 15, null, null, "right");
            const blob = doc.output('blob'); const url = URL.createObjectURL(blob);
            const link = document.createElement('a'); link.href = url; link.download = `RIDHAM_SAVINGS_${selectedMonth.replace(/\s/g, '_')}.pdf`;
            document.body.appendChild(link); link.click(); document.body.removeChild(link);
            window.open(url, '_blank'); closePDFModal();
        }

        function toggleMonth(month) {
            collapsedMonths[month] = !collapsedMonths[month];
            render();
        }

        function addPartInputRow(name = "", shop = "Direct Entry", price = "") {
            const container = document.getElementById('partInputsContainer');
            const index = container.children.length;
            const div = document.createElement('div');
            div.className = "part-row";
            div.style.display = "flex"; div.style.gap = "8px"; div.style.marginBottom = "10px";
            
            div.innerHTML = `
                <input type="text" placeholder="Part" class="p-name" value="${name}" style="flex:1.5; margin:0; padding:10px; font-size:12px;">
                <div class="custom-select-trigger" onclick="openShopPicker(${index})" style="flex:1.2; padding:10px; font-size:11px;">
                    <span class="p-shop-display">${shop}</span>
                </div>
                <input type="hidden" class="p-shop" value="${shop}">
                <input type="number" placeholder="₹" class="p-price" value="${price}" style="flex:0.8; margin:0; padding:10px; font-size:12px;">`;
            container.appendChild(div);
        }

        async function saveData() {
            const model = document.getElementById('model').value;
            const paid = parseFloat(document.getElementById('paid').value) || 0;
            const index = parseInt(document.getElementById('editIndex').value);
            const rawDate = document.getElementById('serviceDate').value;
            const selectedMainShop = document.getElementById('shop').value;

            if(!model || !rawDate) return alert("Model and Date needed!");
            
            let parts = []; let totalCost = 0;
            const names = document.querySelectorAll('.p-name');
            const shops = document.querySelectorAll('.p-shop');
            const prices = document.querySelectorAll('.p-price');
            
            names.forEach((input, i) => {
                const pPrice = parseFloat(prices[i].value) || 0;
                const pShop = shops[i].value;
                if(input.value) { 
                    parts.push({ name: input.value, shop: pShop, price: pPrice }); 
                    totalCost += pPrice; 
                }
            });

            const selectedDate = new Date(rawDate);
            const formattedDate = selectedDate.toLocaleDateString('en-GB'); 
            const monthKey = selectedDate.toLocaleString('default', { month: 'long', year: 'numeric' });
            const itemData = {
                custName: document.getElementById('custName').value,
                custPhone: document.getElementById('custPhone').value,
                model, 
                shop: selectedMainShop, 
                parts, totalCost, paid,
                date: formattedDate, 
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                monthKey: monthKey, 
                timestamp: selectedDate.getTime(), 
                archived: false
            };
            
            if(index === -1) repairs.unshift(itemData);
            else repairs[index] = itemData;
            
            await syncToCloud(); render(); closeModal();
        }

        function shareWhatsApp(i) {
            const r = repairs[i];
            let partsTxt = r.parts.map(p => `• ${p.name} (${p.shop || 'Local'}): ₹${p.price}`).join('\n');
            let text = `*RIDHAM REPAIR BILL*\n*Model:* ${r.model}\n*Date:* ${r.date}\n------------------\n*Work:*\n${partsTxt}\n------------------\n*Total Paid:* ₹${r.paid}`;
            window.open(`https://wa.me/${r.custPhone}?text=${encodeURIComponent(text)}`, '_blank');
        }

        function render() {
            const list = document.getElementById('notesList');
            const searchInput = document.getElementById('searchInput');
            if(!list || !searchInput) return;
            const search = searchInput.value.toLowerCase();
            list.innerHTML = ""; list.className = "container view-" + currentView;
            let grandTotal = 0;

            let filtered = repairs.filter(r => {
                const matchesModel = (r.model && r.model.toLowerCase().includes(search));
                const matchesCustomer = (r.custName && r.custName.toLowerCase().includes(search));
                const matchesShop = (r.shop && r.shop.toLowerCase().includes(search));
                const matchesParts = r.parts && r.parts.some(p => p.name.toLowerCase().includes(search));
                return (matchesModel || matchesCustomer || matchesShop || matchesParts) && !r.archived;
            });

            filtered.sort((a, b) => {
                let valA = a.timestamp || 0;
                let valB = b.timestamp || 0;
                return sortOrder === 'asc' ? (valA - valB) : (valB - valA);
            });

            const monthGroups = filtered.reduce((acc, curr) => {
                if (!acc[curr.monthKey]) acc[curr.monthKey] = [];
                acc[curr.monthKey].push(curr);
                return acc;
            }, {});

            const sortedMonths = Object.keys(monthGroups).sort((a, b) => new Date(b) - new Date(a));

            for (const month of sortedMonths) {
                let monthProfit = 0;
                monthGroups[month].forEach(r => monthProfit += ((r.paid || 0) - (r.totalCost || 0)));

                grandTotal += monthProfit;
                const isCollapsed = collapsedMonths[month];
                const icon = isCollapsed ? '+' : '−';

                list.innerHTML += `
                    <div class="month-header" onclick="toggleMonth('${month}')">
                        <span class="month-title">${month}</span>
                        <div style="display:flex; align-items:center;">
                            <span class="month-sum">Total: ₹${monthProfit}</span>
                            <div class="toggle-icon">${icon}</div>
                        </div>
                    </div>`;

                if (!isCollapsed) {
                    monthGroups[month].forEach((r) => {
                        const profit = (r.paid || 0) - (r.totalCost || 0);
                        const idx = repairs.indexOf(r);
                        
                        list.innerHTML += `
                            <div class="shop-group-header">${r.shop || 'Direct Entry'}</div>
                            <div class="note-card" onclick="if(currentView !== 'detailed') openModal(${idx})">
                                <div class="card-info-row" style="display:flex; justify-content:space-between; align-items:start;">
                                    <div>
                                        <div class="model-name">${r.model}</div>
                                        <div class="cust-info">${r.custName || 'Walk-in'}</div>
                                    </div>
                                    <div class="timestamp-badge">${r.date}</div>
                                </div>
                                <div class="parts-container">
                                    ${r.parts ? r.parts.map(p => `
                                        <div class="part-item">
                                            <span>${p.name}<span class="part-shop">${p.shop ? '@' + p.shop : ''}</span></span>
                                            <span>₹${p.price}</span>
                                        </div>`).join('') : ''}
                                </div>
                                <div class="profit-line">
                                    <span>PAID: ₹${r.paid}</span>
                                    <span>SAVINGS: <span class="profit-amt">₹${profit}</span></span>
                                </div>
                                <div class="actions">
                                    <button class="share-wa" onclick="event.stopPropagation(); shareWhatsApp(${idx})">SHARE</button>
                                    <div class="btn-group">
                                        <button onclick="event.stopPropagation(); openModal(${idx})">EDIT</button>
                                        <button style="color:var(--danger)" onclick="event.stopPropagation(); deleteItem(${idx})">DEL</button>
                                    </div>
                                </div>
                            </div>`;
                    });
                }
            }
            document.getElementById('grandTotal').innerText = `TOTAL PROFIT: ₹${grandTotal}`;
        }

        window.onclick = (e) => {
            if (e.target.className === 'modal') { closeModal(); closeDeleteModal(); closePDFModal(); closeShopListModal(); }
            if (e.target.id === 'shopPickerSheet') closeShopPicker();
            if (!e.target.closest('.menu-container')) {
                document.getElementById('dropdown').style.display = 'none';
                document.getElementById('themeList').style.display = 'none';
            }
            if (!e.target.closest('.view-sort-btn') && !e.target.closest('.vs-modal')) {
                document.getElementById('vsModal').style.display = 'none';
            }
        };

        if(isLightMode) document.body.classList.add('light-mode');
        applyTheme(localStorage.getItem('ridham_theme') || 'rbmods');
        updateVSUI();
    </script>
</body>
</html>
